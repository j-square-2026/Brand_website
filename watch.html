<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch | J²</title>
  <meta name="description" content="YouTube videos and Instagram vlogs from the road.">
  <link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div data-component="nav"></div>

  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">Motion &amp; Moments</p>
      <h1>Watch</h1>
      <p class="lead">Long-form videos on YouTube, quick vlogs on Instagram.</p>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="videos">
          <i class="fa-brands fa-youtube"></i><span>Videos</span>
        </button>
        <button class="tab-btn" data-tab="vlogs">
          <i class="fa-brands fa-instagram"></i><span>Vlogs</span>
        </button>
      </div>

      <div id="tab-videos" class="tab-panel active">
        <div id="video-grid" class="media-grid"></div>
        <p id="video-empty" class="empty-state" hidden>
          <i class="fa-solid fa-video"></i>
          <span>No videos yet. Check back soon.</span>
        </p>
      </div>

      <div id="tab-vlogs" class="tab-panel">
        <div id="vlog-grid" class="vlog-grid"></div>
        <p id="vlog-empty" class="empty-state" hidden>
          <i class="fa-solid fa-clapperboard"></i>
          <span>No vlogs yet. Check back soon.</span>
        </p>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="shared.js"></script>
  <script src="watch.js"></script>
</body>
</html>
