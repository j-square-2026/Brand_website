<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read | J²</title>
  <meta name="description" content="Essays on Substack, blogs on Blogger.">
  <link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div data-component="nav"></div>

  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">Words &amp; Stories</p>
      <h1>Read</h1>
      <p class="lead">Essays and long-form writing on Substack. Short blogs on Blogger.</p>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="articles">
          <span data-icon="substack"></span><span>Articles</span>
        </button>
        <button class="tab-btn" data-tab="blogs">
          <i class="fa-brands fa-blogger-b"></i><span>Blogs</span>
        </button>
      </div>

      <div id="tab-articles" class="tab-panel active">
        <div id="article-grid" class="post-grid"></div>
        <p id="article-empty" class="empty-state" hidden>
          <span data-icon="substack"></span>
          <span>No articles yet. Check back soon.</span>
        </p>
      </div>

      <div id="tab-blogs" class="tab-panel">
        <div id="blog-grid" class="post-grid"></div>
        <p id="blog-empty" class="empty-state" hidden>
          <i class="fa-brands fa-blogger-b"></i>
          <span>No blogs yet. Check back soon.</span>
        </p>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="shared.js"></script>
  <script src="read.js"></script>
</body>
</html>
