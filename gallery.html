<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | J²</title>
<meta name="description" content="Photos, memes, and designs from the road.">
  <link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div data-component="nav"></div>

  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">Camera &amp; Chaos</p>
      <h1>Gallery</h1>
      <p class="lead">Photos from the road and memes from the journey.</p>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="tab-bar">
        <button class="tab-btn active" data-filter="all">
          <i class="fa-solid fa-layer-group"></i><span>All</span>
        </button>
        <button class="tab-btn" data-filter="photo">
          <i class="fa-solid fa-camera"></i><span>Photos</span>
        </button>
        <button class="tab-btn" data-filter="design">
         <i class="fa-solid fa-pen-nib"></i><span>Designs</span>
        </button>
        <button class="tab-btn" data-filter="meme">
          <i class="fa-solid fa-face-laugh-squint"></i><span>Memes</span>
        </button>
      </div>

      <div id="gallery-grid" class="gallery-grid"></div>
      <p id="gallery-empty" class="empty-state" hidden>
        <i class="fa-solid fa-image"></i>
        <span>Nothing here yet. Check back soon.</span>
      </p>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="shared.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
